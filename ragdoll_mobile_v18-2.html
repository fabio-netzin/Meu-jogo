<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Arrow Ragdoll Mobile</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#75b7df;font-family:Arial,sans-serif;touch-action:none}canvas{position:fixed;inset:0;width:100%;height:100%;z-index:1}.hud{position:fixed;top:10px;left:10px;z-index:5;color:#fff;font-weight:800;text-shadow:0 2px 3px #000;pointer-events:none}.bar{width:170px;height:17px;background:#222;border:2px solid #fff;border-radius:10px;overflow:hidden;margin:3px 0 7px}.fill{height:100%;width:100%}.hp{background:#e93645}.st{background:#25bdf5}.wave{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:5;color:#fff;background:#172235e8;padding:8px 14px;border-radius:12px;font-weight:800;pointer-events:none}.money{position:fixed;right:12px;top:10px;z-index:5;color:#fff;background:#172235e8;padding:8px 12px;border-radius:12px;font-weight:800;pointer-events:none}.buttons{position:fixed;right:10px;bottom:10px;z-index:20;display:flex;flex-direction:column;gap:8px}.buttons button,.panel button{appearance:none;border:0;border-radius:13px;background:#182236;color:#fff;padding:13px 15px;font-size:15px;font-weight:800;box-shadow:0 3px 8px #0009;touch-action:manipulation;pointer-events:auto}.buttons button:active,.panel button:active{transform:scale(.97)}.panel{position:fixed;right:10px;bottom:10px;z-index:30;width:min(330px,calc(100% - 20px));max-height:76%;overflow:auto;background:#111a2bf5;color:#fff;border:1px solid #ffffff44;border-radius:17px;padding:14px;display:none;pointer-events:auto}.panel h2{margin:0 0 10px}.panel .item{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#ffffff12;padding:9px;border-radius:11px;margin:7px 0}.panel .item button{padding:9px 10px}.close{width:100%;margin-top:9px}.hint{position:fixed;max-width:70%;text-align:center;left:50%;bottom:12px;transform:translateX(-50%);z-index:4;color:#fff;background:#172235aa;padding:7px 10px;border-radius:10px;font-size:12px;pointer-events:none;white-space:nowrap}
.panel button:disabled{opacity:.45;filter:grayscale(1)}.item small{opacity:.8} </style></head><body><canvas id="game"></canvas><div class="hud">❤️ VIDA <span id="hpNum">100/100</span><div class="bar"><div id="hp" class="fill hp"></div></div>⚡ STAMINA <span id="stNum">100/100</span><div class="bar"><div id="st" class="fill st"></div></div></div><div id="wave" class="wave">Onda 1</div><div class="money">💰 ∞</div><div class="buttons"><button id="pauseBtn">⏸️ Pausar</button><button id="arrowsBtn">🏹 Flechas</button><button id="attrsBtn">⚙️ Atributos</button><button id="helpBtn">❔ Como jogar</button><button id="resetBtn">↻ Reiniciar</button></div><div id="panel" class="panel"></div><div class="hint">Arraste para mirar • solte para atirar • inimigos: 5 dano / 15 cabeça</div><script>
const c=document.getElementById('game'),ctx=c.getContext('2d');const hpEl=document.getElementById('hp'),stEl=document.getElementById('st'),waveEl=document.getElementById('wave'),panel=document.getElementById('panel');let W=innerWidth,H=innerHeight,floorY=H-105,dpr=1,aim=false,ax=0,ay=0,last=0,wave=1,arrows=[],enemies=[],enemyArrows=[],particles=[],damageTexts=[],apples=[],appleTimer=0,type='Normal',enemyShotTimer=0,bossWave=false,paused=false,combo=0,comboTimer=0,waveDelay=0;const platforms=[];
const A={damage:25,maxhp:100,maxst:100,regen:18,speed:1,armor:0,levels:{damage:0,maxhp:0,maxst:0,regen:0,speed:0,armor:0}};const player={x:95,y:0,hp:100,st:100};let gameOver=false;const types={Normal:{cost:12,v:760,g:260,max:20,shape:'normal'},Rápida:{cost:9,v:1050,g:170,max:20,shape:'speed'},Pesada:{cost:18,v:610,g:330,max:15,shape:'heavy'},Fogo:{cost:15,v:720,g:230,max:15,shape:'fire'},Gelo:{cost:14,v:690,g:220,max:15,shape:'ice'},Explosiva:{cost:22,v:650,g:250,max:15,shape:'boom'}};
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;c.style.width=W+'px';c.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);floorY=H-105;player.y=floorY-65;platforms.length=0;platforms.push({x:Math.max(150,W*.55),y:Math.max(145,H*.30),w:Math.min(220,W*.32),h:14},{x:Math.max(80,W*.25),y:Math.max(250,H*.52),w:Math.min(190,W*.28),h:14});spawn()}addEventListener('resize',resize);
function spawn(){
  enemies=[]; enemyArrows=[]; bossWave=(wave%10===0);
  if(bossWave){
    const p=platforms[0];
    enemies.push({x:p.x+p.w*.58,y:p.y-105,baseY:p.y-105,platform:p,hp:360+wave*18,maxhp:360+wave*18,dead:false,vy:0,r:0,skin:'#8e5b3d',shirt:'#5b1e8f',shoot:0.5+Math.random()*4.5,helmet:Math.random()<.45,headHits:0,boss:true,slow:0,burn:0});

    for(let i=0;i<2;i++) enemies.push({x:p2.x+45+i*75,y:p2.y-58,baseY:p2.y-58,platform:p2,hp:55+wave*10,maxhp:55+wave*10,dead:false,vy:0,r:0,skin:i?'#9b6b45':'#d99a6c',shirt:i?'#344f9e':'#a83232',shoot:0.5+Math.random()*4.5,helmet:Math.random()<.4,headHits:0,boss:false,slow:0,burn:0});
  } else {
    const n=Math.min(2+wave,6);
    for(let i=0;i<n;i++){const p=platforms[i%platforms.length];const x=p.x+p.w-35-(Math.floor(i/platforms.length)*45);enemies.push({x,y:p.y-58,baseY:p.y-58,platform:p,hp:45+wave*12,maxhp:45+wave*12,dead:false,vy:0,r:0,skin:i%2?'#9b6b45':'#d99a6c',shirt:i%2?'#6248c7':'#d94b4b',shoot:0.5+Math.random()*4.5,helmet:Math.random()<0.35,headHits:0,boss:false,elite:(wave>=5&&Math.random()<.18),slow:0,burn:0})}
  }
  for(const e of enemies){if(e.elite){e.maxhp=Math.round(e.maxhp*1.55);e.hp=e.maxhp;e.shirt='#b36b17';e.helmet=true}}
  waveEl.textContent=bossWave?'👑 BOSS — Onda '+wave:'Onda '+wave;
}
function ui(){hpEl.style.width=Math.max(0,player.hp/A.maxhp*100)+'%';stEl.style.width=Math.max(0,player.st/A.maxst*100)+'%';document.getElementById('hpNum').textContent=Math.ceil(player.hp)+'/'+A.maxhp;document.getElementById('stNum').textContent=Math.floor(player.st)+'/'+A.maxst;waveEl.textContent=bossWave?'👑 BOSS — Onda '+wave:'Onda '+wave}
function menu(kind){panel.innerHTML='';panel.style.display='block';const h=document.createElement('h2');h.textContent=kind==='arrows'?'🏹 Flechas':'⚙️ Atributos';panel.appendChild(h);if(kind==='arrows'){for(const k of Object.keys(types)){const d=types[k],lv=arrowLevels[k]||0;const row=document.createElement('div');row.className='item';const s=document.createElement('span');s.innerHTML='🏹 <b>'+k+'</b><br><small>Visual próprio • Nível '+lv+'/'+d.max+'</small>';const b=document.createElement('button');b.textContent=k===type?'EQUIPADA ✓':'EQUIPAR';b.disabled=lv>=d.max;b.onclick=()=>{type=k;saveGame();menu('arrows')};row.append(s,b);panel.appendChild(row)}}else{const data=[['damage','💥 Dano','+8',15],['maxhp','❤️ Vida máxima','+20',20],['maxst','⚡ Stamina máxima','+20',20],['regen','🔋 Regeneração','+4',20],['speed','🏹 Velocidade da flecha','+8%',20],['armor','🛡️ Armadura','-5% dano recebido',5]];for(const [k,n,v,max] of data){const lv=A.levels[k]||0;const row=document.createElement('div');row.className='item';const s=document.createElement('span');s.innerHTML='<b>'+n+'</b><br><small>Nível '+lv+'/'+max+' • '+v+'</small>';const b=document.createElement('button');b.textContent=lv>=max?'MÁXIMO':'COMPRAR ∞';b.disabled=lv>=max;b.onclick=()=>{A.levels[k]++;if(k==='damage')A.damage+=8;if(k==='maxhp'){A.maxhp+=20;player.hp=A.maxhp}if(k==='maxst'){A.maxst+=20;player.st=A.maxst}if(k==='regen')A.regen+=4;if(k==='speed')A.speed+=.08;if(k==='armor'){}ui();saveGame();menu('attrs')};row.append(s,b);panel.appendChild(row)}}const close=document.createElement('button');close.className='close';close.textContent='Fechar';close.onclick=()=>panel.style.display='none';panel.appendChild(close)}
const arrowLevels={Normal:0,Rápida:0,Pesada:0,Fogo:0,Gelo:0,Explosiva:0};function saveGame(){try{localStorage.setItem('arrowRagdollSave',JSON.stringify({A,arrowLevels,type,wave}))}catch(e){}}function loadGame(){try{const s=JSON.parse(localStorage.getItem('arrowRagdollSave')||'null');if(s){if(s.A&&s.A.levels){Object.assign(A,s.A);A.levels=Object.assign({damage:0,maxhp:0,maxst:0,regen:0,speed:0,armor:0},s.A.levels)}if(s.arrowLevels)Object.assign(arrowLevels,s.arrowLevels);if(s.type&&types[s.type])type=s.type;if(Number.isFinite(s.wave)&&s.wave>0)wave=Math.floor(s.wave)}}catch(e){}}
loadGame();
document.getElementById('pauseBtn').addEventListener('click',e=>{e.stopPropagation();paused=!paused;e.currentTarget.textContent=paused?'▶️ Continuar':'⏸️ Pausar'});document.getElementById('arrowsBtn').addEventListener('click',e=>{e.stopPropagation();menu('arrows')});document.getElementById('attrsBtn').addEventListener('click',e=>{e.stopPropagation();menu('attrs')});document.getElementById('helpBtn').addEventListener('click',e=>{e.stopPropagation();panel.innerHTML='<h2>❔ Como jogar</h2><p>Arraste para mirar e solte para atirar.</p><p>🎯 Cabeça causa dano maior. 🍎 Acerte maçãs quando sua vida estiver baixa.</p><p>👑 A cada 10 ondas aparece um BOSS.</p><p>🪖 Capacetes exigem 3 tiros na cabeça.</p><button class="close" id="helpClose">Fechar</button>';panel.style.display='block';document.getElementById('helpClose').addEventListener('click',()=>panel.style.display='none')});document.getElementById('resetBtn').addEventListener('click',e=>{e.stopPropagation();reset()});
function shoot(tx,ty){const dx=tx-player.x,dy=ty-(player.y-30),len=Math.hypot(dx,dy)||1,t=types[type];if(player.st<t.cost){beep(120,.05,'square',.02);return}player.st-=t.cost;beep(type==='Explosiva'?180:520,.045,'triangle',.025);const v=t.v*A.speed;arrows.push({x:player.x+25,y:player.y-30,vx:dx/len*v,vy:dy/len*v,g:t.g,kind:type,life:4});ui()}
function pos(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left),y:(e.clientY-r.top)}}c.addEventListener('pointerdown',e=>{if(e.button!==0)return;aim=true;const p=pos(e);ax=p.x;ay=p.y;c.setPointerCapture?.(e.pointerId)});c.addEventListener('pointermove',e=>{if(!aim)return;const p=pos(e);ax=p.x;ay=p.y});c.addEventListener('pointerup',e=>{if(!aim)return;const p=pos(e);ax=p.x;ay=p.y;shoot(ax,ay);aim=false});c.addEventListener('pointercancel',()=>aim=false);
function hit(e,dmg,head=false,kind='Normal'){
  if(e.dead)return;
  const before=e.hp;
  if(head){beep(e.helmet?250:820,.07,'square',.03);
    if(e.helmet){e.headHits=(e.headHits||0)+1;e.hp=Math.max(0,e.maxhp-e.headHits*(e.boss?35:15));}
    else e.hp=e.boss?Math.max(0,e.hp-35):0;
  }else e.hp-=dmg;
  e.hit=.12;
  const dealt=Math.max(0,before-e.hp); damageTexts.push({x:e.x,y:e.y-78,text:(head?'HEAD ':'')+'-'+Math.round(dealt),t:.8,enemy:true});
  combo=head?combo+1:combo; comboTimer=2.2;
  if(kind==='Fogo'){beep(160,.08,'sawtooth',.025);e.burn=2.5;e.burnDps=Math.max(2,dmg*.16)}
  if(kind==='Gelo'){beep(700,.08,'sine',.025);e.slow=2.5}
  if(kind==='Pesada'){e.vy-=180}
  if(kind==='Explosiva'){
    beep(90,.12,'sawtooth',.04);
    e.vy-=260;
    for(let i=0;i<16;i++)particles.push({x:e.x,y:e.y,vx:(Math.random()-.5)*280,vy:(Math.random()-.7)*280,t:.6});
  }
  for(let i=0;i<8;i++)particles.push({x:e.x,y:e.y,vx:(Math.random()-.5)*150,vy:(Math.random()-.8)*150,t:.45});
  if(e.hp<=0){e.dead=true;e.vy=-250;e.r=(Math.random()-.5)*1.5}
}
function drawPerson(o,isPlayer=false){ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.r||0);ctx.scale(o.boss?2:1,o.boss?2:1);const skin=o.skin||'#e1a477',shirt=o.shirt||'#2563c7';ctx.lineCap='round';ctx.strokeStyle='#171717';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(-10,27);ctx.lineTo(-21,60);ctx.moveTo(10,27);ctx.lineTo(21,60);ctx.moveTo(-18,2);ctx.lineTo(-38,25);ctx.moveTo(18,2);ctx.lineTo(38,25);ctx.stroke();ctx.fillStyle=shirt;ctx.fillRect(-19,-6,38,38);ctx.fillStyle=skin;ctx.beginPath();ctx.arc(0,-28,18,0,Math.PI*2);ctx.fill();ctx.fillStyle='#382414';ctx.beginPath();ctx.arc(0,-39,18,Math.PI,Math.PI*2);ctx.fill();ctx.fillStyle='#111';ctx.beginPath();ctx.arc(-6,-28,2.5,0,7);ctx.arc(6,-28,2.5,0,7);ctx.fill();if(o.helmet&&!isPlayer){ctx.fillStyle='#555';ctx.beginPath();ctx.arc(0,-31,20,Math.PI,Math.PI*2);ctx.fill();ctx.fillStyle='#aaa';ctx.fillRect(-19,-32,38,5)}if(isPlayer){ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(18,-2);ctx.lineTo(45,-22);ctx.stroke()}ctx.restore()}
const AudioCtx=window.AudioContext||window.webkitAudioContext;let audioCtx=null;function beep(freq=440,dur=.06,type='sine',vol=.035){try{if(!audioCtx)audioCtx=new AudioCtx();if(audioCtx.state==='suspended')audioCtx.resume();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.value=vol;o.connect(g);g.connect(audioCtx.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);o.stop(audioCtx.currentTime+dur)}catch(e){}}
function reset(){wave=1;arrows=[];enemyArrows=[];particles=[];player.hp=A.maxhp;player.st=A.maxst;gameOver=false;spawn();ui();panel.style.display='none'}
function loop(t){const dt=Math.min(.033,(t-last)/1000||.016);last=t;ctx.clearRect(0,0,W,H);if(comboTimer>0)comboTimer-=dt;else combo=0;if(paused){ctx.fillStyle='#0009';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 28px Arial';ctx.fillText('PAUSADO',W/2,H/2);requestAnimationFrame(loop);return;}ctx.fillStyle='#76b9e8';ctx.fillRect(0,0,W,H);ctx.fillStyle='#4b9a50';ctx.fillRect(0,floorY,W,H-floorY);ctx.fillStyle='#75482c';ctx.fillRect(0,floorY,W,18);ctx.fillStyle='#9a633a';for(let i=0;i<W;i+=50)ctx.fillRect(i,floorY+4,38,6);for(const p of platforms){ctx.fillStyle='#70462b';ctx.fillRect(p.x,p.y,p.w,p.h);ctx.fillStyle='#a66b3b';ctx.fillRect(p.x,p.y,p.w,5);ctx.strokeStyle='#3e291b';ctx.lineWidth=2;ctx.strokeRect(p.x,p.y,p.w,p.h)}player.st=Math.min(A.maxst,player.st+A.regen*dt);
for(const a of arrows){a.x+=a.vx*dt;a.y+=a.vy*dt;a.vy+=a.g*dt;a.life-=dt;for(const e of enemies){if(!e.dead&&Math.hypot(a.x-e.x,a.y-(e.y-8))<40){const head=Math.hypot(a.x-e.x,a.y-(e.y-(e.boss?55:28)))<(e.boss?38:22);const mult=a.kind==='Pesada'?1.35:1;hit(e,A.damage*mult,head,a.kind);a.life=0;if(a.kind==='Explosiva'){for(const q of enemies){if(q!==e&&!q.dead&&Math.hypot(q.x-e.x,q.y-e.y)<90)hit(q,A.damage*.55,false,'Explosiva')}}break}}}
arrows=arrows.filter(a=>a.life>0&&a.x>-100&&a.x<W+100&&a.y<H+100);
// Maçãs de cura: aparecem automaticamente quando a vida está baixa.
if(player.hp<=A.maxhp*0.45){appleTimer-=dt;if(appleTimer<=0 && apples.length<3){apples.push({x:35+Math.random()*(W-70),y:-25,vy:55+Math.random()*45,r:16,spin:0});appleTimer=2.5+Math.random()*2.5}}else{appleTimer=0;apples=[]}
for(const ap of apples){ap.y+=ap.vy*dt;ap.vy+=28*dt;ap.spin+=dt;for(const a of arrows){if(a.life>0&&Math.hypot(a.x-ap.x,a.y-ap.y)<25){player.hp=Math.min(A.maxhp,player.hp+35);beep(760,.12,'sine',.03);damageTexts.push({x:ap.x,y:ap.y-20,text:'+35 ❤️',t:.9});a.life=0;ap.y=H+200}}}
apples=apples.filter(ap=>ap.y<H+60);
enemyShotTimer+=dt;for(const e of enemies){if(e.dead){e.vy+=600*dt;e.y+=e.vy*dt;e.r+=dt*2}else{e.y=e.baseY;e.r=Math.sin(t/450+e.x)*.03;e.shoot-=dt;if(e.burn>0){e.burn-=dt;e.hp=Math.max(0,e.hp-(e.burnDps||2)*dt);if(e.hp<=0){e.dead=true;e.vy=-250}}if(e.slow>0)e.slow-=dt;if(e.shoot<=0){e.shoot=0.5+Math.random()*4.5;beep(e.boss?110:240,.035,'square',.015);const targetX=player.x+(Math.random()-.5)*420;const targetY=player.y-30+(Math.random()-.5)*260;const dx=targetX-e.x,dy=targetY-(e.y-28),len=Math.hypot(dx,dy)||1;const v=e.boss?390:430;enemyArrows.push({x:e.x-25,y:e.y-28,vx:dx/len*v,vy:dy/len*v,g:240,life:4,boss:e.boss})}}e.hit=Math.max(0,(e.hit||0)-dt)}// Desenha as maçãs antes dos projéteis, para ficarem fáceis de acertar.
for(const ap of apples){ctx.save();ctx.translate(ap.x,ap.y);ctx.rotate(Math.sin(ap.spin)*.08);ctx.fillStyle='#e33b3b';ctx.beginPath();ctx.arc(0,2,14,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f7d36a';ctx.beginPath();ctx.arc(-5,-2,4,0,Math.PI*2);ctx.fill();ctx.fillStyle='#5b8f3b';ctx.beginPath();ctx.ellipse(7,-13,7,3, -.35,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#59341e';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(2,-11);ctx.lineTo(4,-17);ctx.stroke();ctx.restore()}
